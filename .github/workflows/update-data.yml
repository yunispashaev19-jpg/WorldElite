name: Update WorldElite Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download billionaire data
        run: |
          python - <<'PY'
          import urllib.request
          import json

          # Правильный URL
          url = "https://raw.githubusercontent.com/komed3/rtb-api/main/api/list/rtb/latest"

          print("Downloading WorldElite data...")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "WorldElite/1.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()

          data = json.loads(raw)
          print("Downloaded successfully.")
          print("Type:", type(data))

          with open("rtb_raw.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Convert data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("rtb_raw.json", "r", encoding="utf-8") as f:
              raw = json.load(f)

          # API возвращает объект с ключом "list"
          if isinstance(raw, dict):
              people = raw.get("list") or raw.get("data") or raw.get("billionaires") or []
          elif isinstance(raw, list):
              people = raw
          else:
              people = []

          result = []

          for index, person in enumerate(people, start=1):
              name = (
                  person.get("name")
                  or person.get("fullName")
                  or person.get("personName")
                  or "Unknown"
              )

              # source может быть списком
              source = person.get("source") or person.get("company") or []
              if isinstance(source, list):
                  company = ", ".join(source) if source else ""
              else:
                  company = str(source)

              # networth приходит в миллионах долларов
              worth_raw = person.get("networth") or person.get("netWorth") or person.get("worth") or 0
              try:
                  worth_millions = float(worth_raw)
                  worth_billions = round(worth_millions / 1000, 1)
              except:
                  worth_billions = 0

              country = (
                  person.get("citizenship")
                  or person.get("country")
                  or ""
              ).upper()

              result.append({
                  "id": index,
                  "name": name,
                  "company": company,
                  "netWorth": f"${worth_billions}B",
                  "worth": worth_billions,
                  "country": country,
                  "flag": ""          # можно потом добавить маппинг флагов
              })

          # Сортируем по состоянию
          result.sort(key=lambda x: x["worth"], reverse=True)

          # Перенумеровываем id после сортировки
          for i, person in enumerate(result, start=1):
              person["id"] = i

          output = {
              "source": "Forbes via RTB API",
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "billionaires": result,
              "companies": []          # пока оставляем пустым
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("WorldElite data.json created.")
          print("Billionaires:", len(result))
          PY

      - name: Remove temporary file
        run: rm -f rtb_raw.json

      - name: Commit updated data
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update billionaire data"
            git push
          fi
