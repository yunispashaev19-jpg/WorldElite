name: Update WorldElite Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download billionaire data
        run: |
          python - <<'PY'
          import urllib.request
          import json

          url = "https://raw.githubusercontent.com/komed3/rtb-api/main/api/list/latest.json"

          print("Downloading WorldElite data...")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "WorldElite/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()

          data = json.loads(raw)

          print("Downloaded successfully.")
          print(type(data))

          with open("rtb_raw.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Convert data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("rtb_raw.json", "r", encoding="utf-8") as f:
              raw = json.load(f)

          if isinstance(raw, dict):

              if "data" in raw:
                  people = raw["data"]

              elif "billionaires" in raw:
                  people = raw["billionaires"]

              elif "list" in raw:
                  people = raw["list"]

              else:
                  people = []

          elif isinstance(raw, list):
              people = raw

          else:
              people = []

          result = []

          for index, person in enumerate(people, start=1):

              name = (
                  person.get("name")
                  or person.get("fullName")
                  or person.get("personName")
                  or person.get("person")
                  or "Unknown"
              )

              company = (
                  person.get("company")
                  or person.get("source")
                  or person.get("sourceOfWealth")
                  or ""
              )

              worth = (
                  person.get("netWorth")
                  or person.get("worth")
                  or person.get("net_worth")
                  or 0
              )

              if isinstance(worth, str):

                  cleaned = (
                      worth
                      .replace("$", "")
                      .replace(",", "")
                      .replace("B", "")
                      .strip()
                  )

                  try:
                      worth_number = float(cleaned)
                  except:
                      worth_number = 0

              else:
                  try:
                      worth_number = float(worth)
                  except:
                      worth_number = 0

              result.append({
                  "id": index,
                  "name": name,
                  "company": company,
                  "netWorth": "$" + str(worth),
                  "worth": worth_number,
                  "country": person.get("country", ""),
                  "flag": ""
              })

          result.sort(
              key=lambda x: x["worth"],
              reverse=True
          )

          for index, person in enumerate(result, start=1):
              person["id"] = index

          output = {
              "source": "Forbes via RTB API",
              "lastUpdated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "billionaires": result,

              "companies": []
          }

          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "WorldElite data.json created."
          )

          print(
              "Billionaires:",
              len(result)
          )
          PY

      - name: Remove temporary file
        run: |
          rm -f rtb_raw.json

      - name: Commit updated data
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update billionaire data"
            git push
          fi
