name: WorldElite Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate data.json
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              count = len(data)
          elif isinstance(data, dict):
              count = len(
                  data.get("billionaires")
                  or data.get("people")
                  or data.get("data")
                  or []
              )
          else:
              count = 0

          print(f"Data validation successful.")
          print(f"Billionaire records detected: {count}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Upload artifact summary
        run: |
          echo "WorldElite build completed."
          echo "Static files prepared for GitHub Pages."

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
