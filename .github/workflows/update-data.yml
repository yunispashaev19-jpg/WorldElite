              }

          ]


          # =================================================
          # MERGE COMPANY DATA
          # =================================================

          existing_by_symbol = {}

          for company in companies:

              if not isinstance(company, dict):
                  continue

              symbol = (
                  company.get("symbol")
                  or company.get("ticker")
                  or company.get("tickerSymbol")
              )

              if symbol:

                  existing_by_symbol[
                      str(symbol).upper()
                  ] = company


          merged_companies = []


          for template in COMPANY_UNIVERSE:

              symbol = template["symbol"].upper()

              existing = existing_by_symbol.get(
                  symbol,
                  {}
              )

              merged = {
                  **template,
                  **existing
              }

              merged["name"] = (
                  existing.get("name")
                  or template["name"]
              )

              merged["symbol"] = symbol

              merged.setdefault(
                  "biography",
                  ""
              )

              merged.setdefault(
                  "investments",
                  []
              )

              merged.setdefault(
                  "stakes",
                  []
              )

              merged.setdefault(
                  "revenue",
                  0
              )

              merged.setdefault(
                  "profit",
                  0
              )

              merged.setdefault(
                  "grossProfit",
                  0
              )

              merged_companies.append(
                  merged
              )


          companies = merged_companies


          print(
              "Company universe:",
              len(companies)
          )


          # =================================================
          # OPTIONAL FMP FINANCIAL DATA
          #
          # FMP IS OPTIONAL.
          # 402 WILL NOT BREAK THE UPDATE.
          # =================================================

          API_KEY = os.environ.get(
              "FMP_API_KEY"
          )


          financial_updates = 0


          if API_KEY:

              print(
                  "FMP key detected. "
                  "Attempting financial updates..."
              )


              for company in companies:

                  symbol = company.get(
                      "symbol"
                  )

                  if not symbol:
                      continue


                  try:

                      response = requests.get(

                          "https://financialmodelingprep.com/"
                          "stable/income-statement",

                          params={
                              "symbol": symbol,
                              "apikey": API_KEY
                          },

                          timeout=15
                      )


                      if response.status_code != 200:

                          print(
                              f"FMP {symbol}: "
                              f"HTTP {response.status_code}"
                          )

                          continue


                      result = response.json()


                      if (
                          not isinstance(
                              result,
                              list
                          )
                          or not result
                      ):

                          continue


                      latest = result[0]


                      if latest.get(
                          "revenue"
                      ) is not None:

                          company["revenue"] = (
                              latest["revenue"]
                          )


                      if latest.get(
                          "grossProfit"
                      ) is not None:

                          company[
                              "grossProfit"
                          ] = latest[
                              "grossProfit"
                          ]


                      if latest.get(
                          "netIncome"
                      ) is not None:

                          company["profit"] = (
                              latest["netIncome"]
                          )


                      company[
                          "financialSource"
                      ] = "Financial Modeling Prep"


                      company[
                          "financialUpdated"
                      ] = latest.get(
                          "date"
                      )


                      financial_updates += 1


                  except Exception as error:

                      print(
                          f"FMP failed for "
                          f"{symbol}: {error}"
                      )


          else:

              print(
                  "No FMP key. "
                  "Continuing with company universe."
              )


          print(
              "Financial updates:",
              financial_updates
          )


          # =================================================
          # WIKIPEDIA BIOGRAPHIES
          #
          # Only enrich top 100 by wealth.
          # This avoids thousands of requests.
          # =================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "WorldElite/1.0 "
                  "(https://yunispashaev19-jpg.github.io/)"
          })


          sorted_people = sorted(
              billionaires,

              key=lambda x:
                  float(
                      x.get("netWorth")
                      or x.get("net_worth")
                      or x.get("worth")
                      or 0
                  )
                  if isinstance(x, dict)
                  else 0,

              reverse=True
          )


          biography_updates = 0


          for person in sorted_people[:100]:

              if not isinstance(
                  person,
                  dict
              ):
                  continue


              name = (
                  person.get("name")
                  or person.get("fullName")
                  or person.get("full_name")
              )


              if not name:
                  continue


              existing_bio = (
                  person.get("biography")
                  or person.get("bio")
                  or ""
              )


              if existing_bio:
                  continue


              try:

                  search_url = (
                      "https://en.wikipedia.org/"
                      "w/rest.php/v1/search/page"
                  )


                  search_response = (
                      session.get(

                          search_url,

                          params={
                              "q": name,
                              "limit": 3
                          },

                          timeout=15
                      )
                  )


                  if (
                      search_response.status_code
                      != 200
                  ):
                      continue


                  search_data = (
                      search_response.json()
                  )


                  pages = (
                      search_data.get(
                          "pages",
                          []
                      )
                  )


                  if not pages:
                      continue


                  title = pages[0].get(
                      "title"
                  )


                  if not title:
                      continue


                  summary_url = (
                      "https://en.wikipedia.org/"
                      "api/rest_v1/page/summary/"
                      + quote(
                          title.replace(
                              " ",
                              "_"
                          )
                      )
                  )


                  summary_response = (
                      session.get(

                          summary_url,

                          timeout=15
                      )
                  )


                  if (
                      summary_response.status_code
                      != 200
                  ):
                      continue


                  summary = (
                      summary_response.json()
                  )


                  extract = (
                      summary.get(
                          "extract"
                      )
                  )


                  if extract:

                      person[
                          "biography"
                      ] = extract

                      person[
                          "biographySource"
                      ] = "Wikipedia"

                      person[
                          "biographyUpdated"
                      ] = datetime.now(
                          timezone.utc
                      ).isoformat()

                      biography_updates += 1


              except Exception as error:

                  print(
                      "Wikipedia failed for",
                      name,
                      error
                  )


              time.sleep(
                  0.15
              )


          print(
              "Biography updates:",
              biography_updates
          )


          # =================================================
          # KNOWN COMPANY RELATIONSHIPS
          # =================================================

          known_relationships = {

              "Elon Musk": {

                  "companies": [
                      "Tesla",
                      "SpaceX",
                      "xAI",
