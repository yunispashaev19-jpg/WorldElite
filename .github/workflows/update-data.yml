                  ],

                  "investmentWhy":
                      "Focuses on technologies that can improve productivity, healthcare, energy systems and long-term global problems."

              },

              "Mark Zuckerberg": {

                  "companies": [
                      "Meta"
                  ],

                  "investmentFocus": [
                      "Artificial Intelligence",
                      "Social technology",
                      "Virtual and augmented reality"
                  ],

                  "investmentWhy":
                      "Focuses heavily on AI and computing infrastructure because these technologies are central to Meta's future products and platforms."

              },

              "Warren Buffett": {

                  "companies": [
                      "Berkshire Hathaway"
                  ],

                  "investmentFocus": [
                      "Financial services",
                      "Consumer brands",
                      "Energy",
                      "Infrastructure"
                  ],

                  "investmentWhy":
                      "Typically favors businesses with durable competitive advantages, strong cash generation and attractive long-term economics."

              }

          }


          for person in billionaires:

              if not isinstance(
                  person,
                  dict
              ):
                  continue


              name = person.get(
                  "name"
              )


              relationship = (
                  known_relationships.get(
                      name
                  )
              )


              if not relationship:
                  continue


              person[
                  "companies"
              ] = relationship[
                  "companies"
              ]


              person[
                  "investmentFocus"
              ] = relationship[
                  "investmentFocus"
              ]


              person[
                  "investmentWhy"
              ] = relationship[
                  "investmentWhy"
              ]


          # =================================================
          # METADATA
          # =================================================

          now = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "lastAutomaticUpdate"
          ] = now


          metadata[
              "billionaireCount"
          ] = len(
              billionaires
          )


          metadata[
              "companyCount"
          ] = len(
              companies
          )


          metadata[
              "financialUpdates"
          ] = financial_updates


          metadata[
              "biographyUpdates"
          ] = biography_updates


          metadata[
              "dataSources"
          ] = [

              "Existing WorldElite billionaire dataset",

              "Wikimedia / Wikipedia REST API",

              "Financial Modeling Prep (optional)"

          ]


          # =================================================
          # SAVE
          # =================================================

          output = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata
          }


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "========================================"
          )

          print(
              "FINAL BILLIONAIRES:",
              len(billionaires)
          )

          print(
              "FINAL COMPANIES:",
              len(companies)
          )

          print(
              "FINANCIAL UPDATES:",
              financial_updates
          )

          print(
              "BIOGRAPHY UPDATES:",
              biography_updates
          )

          print(
              "========================================"


          if len(companies) == 0:

              raise SystemExit(
                  "ERROR: companies are still zero."
              )


          PY


      # =====================================================
      # VALIDATE
      # =====================================================

      - name: Validate final data
        shell: bash
        run: |

          python - <<'PY'

          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if not isinstance(
              data,
              dict
          ):

              raise SystemExit(
                  "ERROR: data.json is not an object."
              )


          billionaires = data.get(
              "billionaires",
              []
          )

          companies = data.get(
              "companies",
              []
          )


          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: billionaire dataset is corrupted."
              )


          if len(companies) < 40:

              raise SystemExit(
                  "ERROR: company dataset is unexpectedly small."
              )


          print(
              "DATA VALIDATION PASSED"
          )

          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated data
        shell: bash
        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
            "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

              echo "No data changes."

          else

              git commit \
                -m "Update WorldElite data"

              git push

          fi


  # =======================================================
  # BUILD
  # =======================================================

  build:

    runs-on: ubuntu-latest

    needs:
      - update-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: .


  # =======================================================
  # DEPLOY
  # =======================================================

  deploy:

    environment:

      name: github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
