name: WorldElite Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldelite
  cancel-in-progress: false


jobs:

  # =========================================================
  # UPDATE DATA
  # =========================================================

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # -------------------------------------------------------
      # Validate existing data BEFORE touching anything
      # -------------------------------------------------------

      - name: Validate current data
        shell: bash
        run: |

          python - <<'PY'

          import json
          import sys

          try:

              with open(
                  "data.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

          except Exception as error:

              print("ERROR: data.json cannot be read.")
              print(error)

              sys.exit(1)


          if isinstance(data, list):

              billionaires = data
              companies = []

          elif isinstance(data, dict):

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

              companies = (
                  data.get("companies")
                  or data.get("Companies")
                  or []
              )

          else:

              print("ERROR: Unsupported data.json structure.")
              sys.exit(1)


          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              print(
                  "ERROR: Billionaire dataset is unexpectedly small."
              )

              sys.exit(1)


          print("Current data is valid.")

          PY


      # -------------------------------------------------------
      # Install requests
      # -------------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip
          pip install requests


      # =======================================================
      # UPDATE EXISTING COMPANIES ONLY
      #
      # IMPORTANT:
      #
      # We DO NOT use company-screener.
      #
      # This prevents FMP 402 from killing the workflow.
      #
      # Existing companies are NEVER deleted.
      # =======================================================

      - name: Update existing company financial data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        shell: bash

        run: |

          python - <<'PY'

          import json
          import os
          import requests
          from datetime import datetime, timezone


          DATA_FILE = "data.json"

          API_KEY = os.environ.get(
              "FMP_API_KEY",
              ""
          ).strip()


          # ---------------------------------------------------
          # Load data
          # ---------------------------------------------------

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if isinstance(data, list):

              billionaires = data
              companies = []
              metadata = {}

          elif isinstance(data, dict):

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

              companies = (
                  data.get("companies")
                  or data.get("Companies")
                  or []
              )

              metadata = (
                  data.get("metadata")
                  or {}
              )

          else:

              raise SystemExit(
                  "Unsupported data.json structure."
              )


          # ---------------------------------------------------
          # Safety check
          # ---------------------------------------------------

          if len(billionaires) < 3000:

              raise SystemExit(
                  "Refusing update because billionaire dataset is too small."
              )


          print(
              f"Billionaires before update: {len(billionaires)}"
          )

          print(
              f"Existing companies: {len(companies)}"
          )


          # ---------------------------------------------------
          # NEVER delete companies
          # ---------------------------------------------------

          original_company_count = len(companies)


          # ---------------------------------------------------
          # If there are no companies, do not fail.
          #
          # This is important because FMP company discovery
          # may not be available on the current API plan.
          # ---------------------------------------------------

          if not companies:

              print(
                  "No companies currently exist in data.json."
              )

              print(
                  "Skipping company discovery."
              )

              print(
                  "Existing billionaire data will be preserved."
              )


          # ---------------------------------------------------
          # No API key?
          #
          # Don't destroy the dataset.
          # ---------------------------------------------------

          if not API_KEY:

              print(
                  "FMP_API_KEY is not available."
              )

              print(
                  "Skipping financial updates."
              )

          else:

              # ------------------------------------------------
              # Get tickers from EXISTING companies only
              # ------------------------------------------------

              symbols = []


              for company in companies:

                  if not isinstance(
                      company,
                      dict
                  ):

                      continue


                  symbol = (
                      company.get("symbol")
                      or company.get("ticker")
                      or company.get("tickerSymbol")
                  )


                  if symbol:

                      symbol = (
                          str(symbol)
                          .strip()
                          .upper()
                      )


                      if symbol:

                          symbols.append(
                              symbol
                          )


              # Remove duplicates

              symbols = list(
                  dict.fromkeys(symbols)
              )


              print(
                  f"Existing company tickers: {len(symbols)}"
              )


              # ------------------------------------------------
              # Update each existing company
              # ------------------------------------------------

              successful = 0
              failed = 0


              for symbol in symbols:

                  try:

                      url = (
                          "https://financialmodelingprep.com/"
                          "stable/income-statement"
                      )


                      response = requests.get(

                          url,

                          params={
                              "symbol": symbol,
                              "apikey": API_KEY
                          },

                          timeout=30
                      )


                      # ----------------------------------------
                      # 402 = plan doesn't allow this endpoint
                      #
                      # DO NOT FAIL THE ENTIRE DEPLOYMENT.
                      # ----------------------------------------

                      if response.status_code == 402:

                          print(
                              f"{symbol}: FMP returned 402."
                          )

                          print(
                              "Current FMP plan does not allow "
                              "this financial endpoint."
                          )

                          print(
                              "Skipping this company."
                          )

                          failed += 1

                          continue


                      if response.status_code != 200:

                          print(
                              f"{symbol}: HTTP "
                              f"{response.status_code}"
                          )

                          failed += 1

                          continue


                      try:

                          result = response.json()

                      except Exception:

                          print(
                              f"{symbol}: invalid JSON response."
                          )

                          failed += 1

                          continue


                      if not isinstance(
                          result,
                          list
                      ):

                          print(
                              f"{symbol}: unexpected response."
                          )

                          failed += 1

                          continue


                      if not result:

                          print(
                              f"{symbol}: no financial records."
                          )

                          continue


                      latest = result[0]


                      # ----------------------------------------
                      # Find existing company
                      # ----------------------------------------

                      company = None


                      for item in companies:

                          if not isinstance(
                              item,
                              dict
                          ):

                              continue


                          item_symbol = (
                              item.get("symbol")
                              or item.get("ticker")
                              or item.get("tickerSymbol")
                          )


                          if (
                              item_symbol
                              and
                              str(
                                  item_symbol
                              ).strip().upper()
                              == symbol
                          ):

                              company = item

                              break


                      if company is None:

                          continue


                      # ----------------------------------------
                      # Financial values
                      # ----------------------------------------

                      revenue = latest.get(
                          "revenue"
                      )

                      gross_profit = latest.get(
                          "grossProfit"
                      )

                      net_income = latest.get(
                          "netIncome"
                      )


                      if revenue is not None:

                          company[
                              "revenue"
                          ] = revenue


                      if gross_profit is not None:

                          company[
                              "grossProfit"
                          ] = gross_profit


                      if net_income is not None:

                          company[
                              "netProfit"
                          ] = net_income


                      company[
                          "financialSource"
                      ] = (
                          "Financial Modeling Prep"
                      )


                      company[
                          "financialUpdated"
                      ] = (
                          latest.get("date")
                      )


                      successful += 1


                      print(
                          f"Updated {symbol}"
                      )


                  except Exception as error:

                      failed += 1

                      print(
                          f"{symbol}: update failed:"
                      )

                      print(error)


              print(
                  "Successful company updates:",
                  successful
              )

              print(
                  "Failed/skipped company updates:",
                  failed
              )


          # ===================================================
          # Metadata
          # ===================================================

          now = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "lastAutomaticUpdate"
          ] = now


          metadata[
              "billionaireRecords"
          ] = len(billionaires)


          metadata[
              "companyRecords"
          ] = len(companies)


          metadata[
              "companyRecordsBeforeUpdate"
          ] = original_company_count


          metadata[
              "automaticUpdater"
          ] = "WorldElite GitHub Actions"


          # ===================================================
          # SAVE
          # ===================================================

          output = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata

          }


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("==============================")
          print("FINAL DATA")
          print("==============================")

          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Companies:",
              len(companies)
          )

          print("==============================")


          PY


      # =======================================================
      # FINAL SAFETY VALIDATION
      # =======================================================

      - name: Validate final data
        shell: bash
        run: |

          python - <<'PY'

          import json
          import sys


          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if not isinstance(
              data,
              dict
          ):

              print(
                  "ERROR: data.json is not an object."
              )

              sys.exit(1)


          billionaires = (
              data.get("billionaires")
              or []
          )


          companies = (
              data.get("companies")
              or []
          )


          print(
              "Final billionaire count:",
              len(billionaires)
          )


          print(
              "Final company count:",
              len(companies)
          )


          # ---------------------------------------------------
          # Billionaires must survive
          # ---------------------------------------------------

          if len(billionaires) < 3000:

              print(
                  "ERROR: Billionaire data was corrupted."
              )

              sys.exit(1)


          # ---------------------------------------------------
          # Companies key must exist
          # ---------------------------------------------------

          if "companies" not in data:

              print(
                  "ERROR: companies field disappeared."
              )

              sys.exit(1)


          # ---------------------------------------------------
          # Metadata must exist
          # ---------------------------------------------------

          if "metadata" not in data:

              print(
                  "ERROR: metadata field disappeared."
              )

              sys.exit(1)


          print(
              "Final data validation successful."
          )

          PY


      # =======================================================
      # COMMIT
      # =======================================================

      - name: Commit updated data
        shell: bash
        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
            "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

              echo "No data changes."

          else

              git commit \
                -m "Auto update WorldElite data"

              git push

          fi



  # =========================================================
  # BUILD GITHUB PAGES
  # =========================================================

  build:

    runs-on: ubuntu-latest

    needs:
      - update-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .



  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:

    runs-on: ubuntu-latest

    needs:
      - build

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
