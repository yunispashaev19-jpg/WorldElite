name: WorldElite Data Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: worldelite-data
  cancel-in-progress: false

jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =====================================================
      # UPDATE DATA
      # =====================================================

      - name: Update WorldElite data
        shell: bash
        env:
          SEC_USER_AGENT: "WorldElite contact@worldelite.app"
        run: |

          python - <<'PY'

          import json
          import os
          import time
          import requests
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed


          # =================================================
          # CONFIG
          # =================================================

          DATA_FILE = "data.json"

          COMPANY_TARGET = 1200

          USER_AGENT = os.environ.get(
              "SEC_USER_AGENT",
              "WorldElite worldelite@example.com"
          )

          SEC_HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Host": "www.sec.gov"
          }


          # =================================================
          # HELPERS
          # =================================================

          def safe_number(value):

              if value is None:
                  return 0

              try:
                  return float(value)
              except:
                  return 0


          def first(obj, keys, default=""):

              if not isinstance(obj, dict):
                  return default

              for key in keys:

                  value = obj.get(key)

                  if value not in (
                      None,
                      "",
                      [],
                      {}
                  ):
                      return value

              return default


          def normalize_name(name):

              return (
                  str(name)
                  .lower()
                  .strip()
                  .replace(",", "")
                  .replace(".", "")
                  .replace("-", " ")
              )


          def request_json(url, params=None):

              try:

                  response = requests.get(
                      url,
                      headers=SEC_HEADERS,
                      params=params,
                      timeout=30
                  )

                  if response.status_code != 200:

                      print(
                          "HTTP",
                          response.status_code,
                          url
                      )

                      return None

                  return response.json()

              except Exception as error:

                  print(
                      "Request failed:",
                      error
                  )

                  return None


          # =================================================
          # LOAD EXISTING DATA
          # =================================================

          print("")
          print("======================================")
          print("Loading existing data.json")
          print("======================================")

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              raw = json.load(f)


          if isinstance(raw, list):

              billionaires = raw
              companies = []
              metadata = {}

          elif isinstance(raw, dict):

              billionaires = (
                  raw.get("billionaires")
                  or raw.get("Billionaires")
                  or raw.get("people")
                  or []
              )

              companies = (
                  raw.get("companies")
                  or raw.get("Companies")
                  or raw.get("businesses")
                  or []
              )

              metadata = (
                  raw.get("metadata")
                  or {}
              )

          else:

              raise SystemExit(
                  "Invalid data.json format."
              )


          print(
              "Billionaires before update:",
              len(billionaires)
          )

          print(
              "Companies before update:",
              len(companies)
          )


          # =================================================
          # SAFETY CHECK
          # =================================================

          if len(billionaires) < 3000:

              raise SystemExit(
                  "STOP: billionaire dataset is too small."
              )


          # =================================================
          # EXISTING COMPANY MAP
          # =================================================

          company_map = {}

          for company in companies:

              if not isinstance(company, dict):
                  continue

              name = first(
                  company,
                  [
                      "name",
                      "companyName",
                      "company_name",
                      "title"
                  ]
              )

              if name:

                  company_map[
                      normalize_name(name)
                  ] = company


          # =================================================
          # SEC COMPANY UNIVERSE
          #
          # NO API KEY
          # =================================================

          print("")
          print("======================================")
          print("Downloading SEC company universe")
          print("======================================")


          ticker_url = (
              "https://www.sec.gov/files/"
              "company_tickers.json"
          )


          ticker_data = request_json(
              ticker_url
          )


          if not ticker_data:

              raise SystemExit(
                  "Could not download SEC company universe."
              )


          sec_companies = []


          for item in ticker_data.values():

              if not isinstance(item, dict):
                  continue

              cik = item.get("cik_str")
              ticker = item.get("ticker")
              title = item.get("title")


              if not cik or not ticker or not title:
                  continue


              sec_companies.append({

                  "cik": str(cik).zfill(10),

                  "ticker": str(
                      ticker
                  ).upper().strip(),

                  "name": str(
                      title
                  ).strip()

              })


          # Remove duplicates

          unique = {}

          for company in sec_companies:

              key = company["ticker"]

              unique[key] = company


          sec_companies = list(
              unique.values()
          )


          print(
              "SEC companies available:",
              len(sec_companies)
          )


          # =================================================
          # MERGE EXISTING + NEW COMPANIES
          # =================================================

          added = 0


          for sec_company in sec_companies:

              if len(company_map) >= COMPANY_TARGET:
                  break


              key = normalize_name(
                  sec_company["name"]
              )


              if key in company_map:

                  company = company_map[key]

                  # Never remove existing data

                  company.setdefault(
                      "symbol",
                      sec_company["ticker"]
                  )

                  company.setdefault(
                      "ticker",
                      sec_company["ticker"]
                  )

                  company.setdefault(
                      "cik",
                      sec_company["cik"]
                  )

                  continue


              company = {

                  "name":
                      sec_company["name"],

                  "companyName":
                      sec_company["name"],

                  "symbol":
                      sec_company["ticker"],

                  "ticker":
                      sec_company["ticker"],

                  "cik":
                      sec_company["cik"],

                  "country":
                      "United States",

                  "countryCode":
                      "US",

                  "biography":
                      "",

                  "description":
                      "",

                  "industry":
                      "",

                  "sector":
                      "",

                  "revenue":
                      0,

                  "grossProfit":
                      0,

                  "netProfit":
                      0,

                  "investments":
                      [],

                  "stakes":
                      [],

                  "investmentReasons":
                      [],

                  "financialSource":
                      "SEC EDGAR",

                  "dataSource":
                      "SEC EDGAR",

                  "financialUpdated":
                      None

              }


              companies.append(
                  company
              )

              company_map[key] = company

              added += 1


          print(
              "Companies added:",
              added
          )

          print(
              "Company universe now:",
              len(companies)
          )


          # =================================================
          # LIMIT TO AT LEAST 1000
          # =================================================

          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: Could not create 1000+ companies."
              )


          # =================================================
          # COMPANY ENRICHMENT
          #
          # SEC SUBMISSIONS
          # =================================================

          print("")
          print("======================================")
          print("Enriching company profiles")
          print("======================================")


          def enrich_company(company):

              cik = company.get("cik")

              if not cik:
                  return


              url = (
                  "https://data.sec.gov/submissions/"
                  f"CIK{cik}.json"
              )


              try:

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              USER_AGENT,
                          "Accept-Encoding":
                              "gzip, deflate"
                      },
                      timeout=30
                  )


                  if response.status_code != 200:

                      return


                  data = response.json()


                  sic_description = data.get(
                      "sicDescription"
                  )

                  sic = data.get(
                      "sic"
                  )


                  addresses = data.get(
                      "addresses",
                      {}
                  )


                  business = addresses.get(
                      "business",
                      {}
                  )


                  state = business.get(
                      "stateOrCountry",
                      ""
                  )


                  city = business.get(
                      "city",
                      ""
                  )


                  if sic_description:

                      company[
                          "industry"
                      ] = sic_description


                      company[
                          "sector"
                      ] = sic_description


                  if not company.get(
                      "biography"
                  ):

                      description_parts = []


                      description_parts.append(
                          f"{company.get('name')} "
                          f"is a publicly listed company "
                          f"tracked through SEC EDGAR."
                      )


                      if sic_description:

                          description_parts.append(
                              f"It operates in the "
                              f"{sic_description} industry."
                          )


                      if city or state:

                          location = ", ".join(
                              x
                              for x in [
                                  city,
                                  state
                              ]
                              if x
                          )


                          description_parts.append(
                              f"Its reported business "
                              f"location is {location}."
                          )


                      company[
                          "biography"
                      ] = " ".join(
                          description_parts
                      )


                  company[
                      "description"
                  ] = company[
                      "biography"
                  ]


                  company[
                      "sic"
                  ] = sic or ""


                  company[
                      "headquarters"
                  ] = ", ".join(
                      x
                      for x in [
                          city,
                          state
                      ]
                      if x
                  )


                  company[
                      "profileSource"
                  ] = "SEC EDGAR"


              except Exception as error:

                  print(
                      "Company profile failed:",
                      company.get("symbol"),
                      error
                  )


          # =================================================
          # ENRICH COMPANIES
          # =================================================

          with ThreadPoolExecutor(
              max_workers=5
          ) as executor:

              futures = [

                  executor.submit(
                      enrich_company,
                      company
                  )

                  for company in companies[:COMPANY_TARGET]
              ]


              for future in as_completed(
                  futures
              ):

                  try:
                      future.result()
                  except:
                      pass


          # =================================================
          # FINANCIAL DATA
          #
          # SEC COMPANYFACTS
          # =================================================

          print("")
          print("======================================")
          print("Downloading SEC financial data")
          print("======================================")


          def get_fact(facts, taxonomy, key):

              try:

                  units = (
                      facts
                      .get("facts", {})
                      .get(taxonomy, {})
                      .get(key, {})
                      .get("units", {})
                  )


                  if "USD" not in units:
                      return None


                  values = units["USD"]


                  if not values:
                      return None


                  annual = [
                      x
                      for x in values
                      if x.get("fp") == "FY"
                  ]


                  source = (
                      annual
                      if annual
                      else values
                  )


                  source = sorted(
                      source,
                      key=lambda x:
                          x.get(
                              "filed",
                              ""
                          )
                  )


                  return source[-1].get(
                      "val"
                  )


              except:

                  return None


          def enrich_financials(company):

              cik = company.get("cik")

              if not cik:
                  return


              url = (
                  "https://data.sec.gov/api/xbrl/"
                  f"companyfacts/CIK{cik}.json"
              )


              try:

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              USER_AGENT,
                          "Accept-Encoding":
                              "gzip, deflate"
                      },
                      timeout=30
                  )


                  if response.status_code != 200:
                      return


                  facts = response.json()


                  revenue = None

                  for key in [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "Revenues",
                      "SalesRevenueNet"
                  ]:

                      revenue = get_fact(
                          facts,
                          "us-gaap",
                          key
                      )

                      if revenue is not None:
                          break


                  gross_profit = get_fact(
                      facts,
                      "us-gaap",
                      "GrossProfit"
                  )


                  net_profit = None

                  for key in [
                      "NetIncomeLoss",
                      "ProfitLoss"
                  ]:

                      net_profit = get_fact(
                          facts,
                          "us-gaap",
                          key
                      )

                      if net_profit is not None:
                          break


                  if revenue is not None:

                      company[
                          "revenue"
                      ] = revenue


                  if gross_profit is not None:

                      company[
                          "grossProfit"
                      ] = gross_profit


                  if net_profit is not None:

                      company[
                          "netProfit"
                      ] = net_profit


                  company[
                      "financialSource"
                  ] = "SEC EDGAR"


                  company[
                      "financialUpdated"
                  ] = datetime.now(
                      timezone.utc
                  ).isoformat()


              except Exception as error:

                  print(
                      "Financial update failed:",
                      company.get("symbol"),
                      error
                  )


          with ThreadPoolExecutor(
              max_workers=5
          ) as executor:

              futures = [

                  executor.submit(
                      enrich_financials,
                      company
                  )

                  for company in companies[
                      :COMPANY_TARGET
                  ]

              ]


              for future in as_completed(
                  futures
              ):

                  try:
                      future.result()
                  except:
                      pass


          # =================================================
          # BILLIONAIRE SAFETY
          # =================================================

          for person in billionaires:

              if not isinstance(
                  person,
                  dict
              ):
                  continue


              person.setdefault(
                  "biography",
                  ""
              )


              person.setdefault(
                  "investments",
                  []
              )


              person.setdefault(
                  "stakes",
                  []
              )


              person.setdefault(
                  "investmentReasons",
                  []
              )


          # =================================================
          # METADATA
          # =================================================

          metadata[
              "lastAutomaticUpdate"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "dataSource"
          ] = "SEC EDGAR"


          metadata[
              "billionaireCount"
          ] = len(
              billionaires
          )


          metadata[
              "companyCount"
          ] = len(
              companies
          )


          metadata[
              "automaticUpdates"
          ] = True


          # =================================================
          # SAVE
          # =================================================

          output = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata
          }


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =================================================
          # FINAL CHECK
          # =================================================

          print("")
          print("======================================")
          print("FINAL RESULT")
          print("======================================")


          print(
              "Billionaires:",
              len(billionaires)
          )


          print(
              "Companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: Billionaire data was lost."
              )


          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: Company dataset is below 1000."
              )


          print("")
          print(
              "WorldElite data update successful."
          )

          PY


      # =====================================================
      # VALIDATE JSON
      # =====================================================

      - name: Validate data.json
        run: |

          python - <<'PY'

          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          billionaires = data.get(
              "billionaires",
              []
          )


          companies = data.get(
              "companies",
              []
          )


          print(
              "Billionaires:",
              len(billionaires)
          )


          print(
              "Companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "Billionaire dataset corrupted."
              )


          if len(companies) < 1000:

              raise SystemExit(
                  "Company dataset corrupted."
              )


          print(
              "JSON validation successful."
          )

          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated data
        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
            "worldelite-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then

              echo "No data changes."

          else

              git commit \
                -m "Auto update WorldElite data"

              git push

          fi

      # =====================================================
      # DEPLOY
      # =====================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


  deploy:

    runs-on: ubuntu-latest

    needs:
      - update-data

    permissions:
      pages: write
      id-token: write

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
