name: WorldElite Data & Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldelite-pages
  cancel-in-progress: false


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # INSTALL PYTHON
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =====================================================
      # UPDATE DATA
      # =====================================================

      - name: Update WorldElite data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        shell: bash

        run: |

          python - <<'PY'

          import json
          import os
          import re
          import time
          import requests
          from datetime import datetime, timezone
          from urllib.parse import quote


          DATA_FILE = "data.json"

          print("========================================")
          print("WORLD ELITE DATA UPDATE")
          print("========================================")


          # =================================================
          # LOAD EXISTING DATA
          # =================================================

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              raw = json.load(f)


          if isinstance(raw, list):

              billionaires = raw
              companies = []
              metadata = {}

          elif isinstance(raw, dict):

              billionaires = (
                  raw.get("billionaires")
                  or raw.get("Billionaires")
                  or raw.get("people")
                  or raw.get("richestPeople")
                  or []
              )

              companies = (
                  raw.get("companies")
                  or raw.get("Companies")
                  or raw.get("businesses")
                  or []
              )

              metadata = (
                  raw.get("metadata")
                  or {}
              )

          else:

              billionaires = []
              companies = []
              metadata = {}


          print(
              "Billionaires before update:",
              len(billionaires)
          )

          print(
