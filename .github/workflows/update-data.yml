name: WorldElite Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install requests


            - name: Test FMP API access
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        shell: bash

        run: |

          python - <<'PY'

          import os
          import requests

          key = os.environ.get("FMP_API_KEY")

          if not key:
              raise SystemExit("FMP_API_KEY is missing")


          endpoints = [

              (
                  "Company Profile",
                  "https://financialmodelingprep.com/stable/profile",
                  {
                      "symbol": "AAPL",
                      "apikey": key
                  }
              ),

              (
                  "Income Statement",
                  "https://financialmodelingprep.com/stable/income-statement",
                  {
                      "symbol": "AAPL",
                      "apikey": key,
                      "limit": 1
                  }
              ),

              (
                  "Company Screener",
                  "https://financialmodelingprep.com/stable/company-screener",
                  {
                      "apikey": key,
                      "limit": 5,
                      "isActivelyTrading": "true"
                  }
              )

          ]


          for name, url, params in endpoints:

              print()
              print("=" * 60)
              print(name)
              print("=" * 60)

              try:

                  response = requests.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      response.status_code
                  )

                  print(
                      response.text[:1000]
                  )

              except Exception as error:

                  print(
                      "ERROR:",
                      error
                  )

          PY
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        shell: bash

        run: |

          python - <<'PY'

          import json
          import os
          import requests
          from datetime import datetime, timezone


          API_KEY = os.environ.get("FMP_API_KEY")


          if not API_KEY:

              raise SystemExit(
                  "FMP_API_KEY secret is missing."
              )


          DATA_FILE = "data.json"


          # =====================================================
          # LOAD EXISTING DATA
          # =====================================================

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if isinstance(data, dict):

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

              old_companies = (
                  data.get("companies")
                  or data.get("Companies")
                  or []
              )

              metadata = (
                  data.get("metadata")
                  or {}
              )

          elif isinstance(data, list):

              billionaires = data

              old_companies = []

              metadata = {}

          else:

              raise SystemExit(
                  "Invalid data.json structure."
              )


          # =====================================================
          # PROTECT BILLIONAIRE DATABASE
          # =====================================================

          print(
              "Billionaires before update:",
              len(billionaires)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "STOP: billionaire database is too small."
              )


          # =====================================================
          # COMPANY DATABASE
          # =====================================================

          companies = []


          # -----------------------------------------------------
          # First keep any companies that already exist
          # -----------------------------------------------------

          if isinstance(old_companies, list):

              for company in old_companies:

                  if isinstance(company, dict):

                      companies.append(company)


          print(
              "Existing companies:",
              len(companies)
          )


          # =====================================================
          # GET COMPANY SYMBOLS
          # =====================================================

          print(
              "Requesting company universe from FMP..."
          )


          screener_url = (
              "https://financialmodelingprep.com/"
              "stable/company-screener"
          )


          params = {

              "apikey": API_KEY,

              "limit": 1000,

              "isEtf": "false",

              "isFund": "false",

              "isActivelyTrading": "true"

          }


          try:

              response = requests.get(
                  screener_url,
                  params=params,
                  timeout=60
              )

          except Exception as error:

              raise SystemExit(
                  f"FMP request failed: {error}"
              )


          print(
              "FMP status:",
              response.status_code
          )


          if response.status_code != 200:

              raise SystemExit(
                  "FMP company screener request failed."
              )


          result = response.json()


          if not isinstance(result, list):

              raise SystemExit(
                  "FMP returned invalid company data."
              )


          print(
              "Companies received from FMP:",
              len(result)
          )


          # =====================================================
          # CREATE COMPANY RECORDS
          # =====================================================

          existing_by_symbol = {}


          for company in companies:

              symbol = (

                  company.get("symbol")

                  or company.get("ticker")

                  or company.get("tickerSymbol")

              )


              if symbol:

                  existing_by_symbol[
                      str(symbol).upper()
                  ] = company


          new_companies = []


          for item in result:

              if not isinstance(item, dict):

                  continue


              symbol = item.get("symbol")


              if not symbol:

                  continue


              symbol = str(
                  symbol
              ).upper().strip()


              name = (

                  item.get("companyName")

                  or item.get("name")

                  or symbol

              )


              country = (

                  item.get("country")

                  or "Unknown"

              )


              sector = (

                  item.get("sector")

                  or ""

              )


              industry = (

                  item.get("industry")

                  or ""

              )


              market_cap = (

                  item.get("marketCap")

                  or 0

              )


              if symbol in existing_by_symbol:

                  company = existing_by_symbol[
                      symbol
                  ]

              else:

                  company = {

                      "symbol": symbol,

                      "name": name,

                      "country": country,

                      "sector": sector,

                      "industry": industry,

                      "marketCap": market_cap,

                      "revenue": 0,

                      "grossProfit": 0,

                      "netProfit": 0,

                      "biography": "",

                      "investments": [],

                      "stakes": [],

                      "investmentReasons": [],

                      "financialSource":
                          "Financial Modeling Prep"

                  }


              # Update basic information

              company["symbol"] = symbol

              company["name"] = name

              company["country"] = country

              company["sector"] = sector

              company["industry"] = industry

              company["marketCap"] = market_cap


              new_companies.append(
                  company
              )


          # =====================================================
          # LIMIT TO 1000+
          # =====================================================

          # Keep the largest companies by market cap.

          new_companies.sort(

              key=lambda x:
                  float(
                      x.get("marketCap") or 0
                  ),

              reverse=True

          )


          # At least 1000 companies if FMP supplies them.

          companies = new_companies[:1500]


          print(
              "Company database created:",
              len(companies)
          )


          # =====================================================
          # FINANCIAL DATA
          # =====================================================

          income_url = (
              "https://financialmodelingprep.com/"
              "stable/income-statement"
          )


          updated = 0


          # Update a reasonable number on each scheduled run.
          # This prevents unnecessary API abuse.

          for company in companies[:500]:

              symbol = company.get(
                  "symbol"
              )


              if not symbol:

                  continue


              try:

                  response = requests.get(

                      income_url,

                      params={

                          "symbol": symbol,

                          "apikey": API_KEY,

                          "limit": 1

                      },

                      timeout=30

                  )


                  if response.status_code != 200:

                      continue


                  statements = response.json()


                  if not isinstance(
                      statements,
                      list
                  ):

                      continue


                  if not statements:

                      continue


                  latest = statements[0]


                  revenue = latest.get(
                      "revenue"
                  )


                  gross_profit = latest.get(
                      "grossProfit"
                  )


                  net_income = latest.get(
                      "netIncome"
                  )


                  if revenue is not None:

                      company["revenue"] = (
                          revenue
                      )


                  if gross_profit is not None:

                      company["grossProfit"] = (
                          gross_profit
                      )


                  if net_income is not None:

                      company["netProfit"] = (
                          net_income
                      )


                  company[
                      "financialUpdated"
                  ] = latest.get(
                      "date"
                  )


                  updated += 1


              except Exception as error:

                  print(
                      f"{symbol}: {error}"
                  )


          print(
              "Financial records updated:",
              updated
          )


          # =====================================================
          # METADATA
          # =====================================================

          metadata[
              "lastAutomaticUpdate"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "companyCount"
          ] = len(companies)


          metadata[
              "financialRecordsUpdated"
          ] = updated


          metadata[
              "financialSource"
          ] = (
              "Financial Modeling Prep"
          )


          # =====================================================
          # FINAL DATA
          # =====================================================

          final_data = {

              "source":
                  data.get(
                      "source",
                      "Forbes via RTB API"
                  ),

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata

          }


          # =====================================================
          # FINAL SAFETY CHECK
          # =====================================================

          if len(
              final_data["billionaires"]
          ) < 3000:

              raise SystemExit(
                  "SAFETY ERROR: billionaire data lost."
              )


          if len(
              final_data["companies"]
          ) < 1000:

              raise SystemExit(

                  "SAFETY ERROR: fewer than "
                  "1000 companies were received."

              )


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(

                  final_data,

                  f,

                  ensure_ascii=False,

                  indent=2

              )


          print()
          print(
              "================================"
          )

          print(
              "WorldElite update successful"
          )

          print(
              "Billionaires:",
              len(
                  final_data["billionaires"]
              )
          )

          print(
              "Companies:",
              len(
                  final_data["companies"]
              )
          )

          print(
              "================================"
          )


          PY


      - name: Validate data.json

        shell: bash

        run: |

          python - <<'PY'

          import json


          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          billionaires = data.get(
              "billionaires",
              []
          )


          companies = data.get(
              "companies",
              []
          )


          print(
              "Billionaires:",
              len(billionaires)
          )


          print(
              "Companies:",
              len(companies)
          )


          if len(
              billionaires
          ) < 3000:

              raise SystemExit(
                  "Invalid billionaire count."
              )


          if len(
              companies
          ) < 1000:

              raise SystemExit(
                  "Invalid company count."
              )


          print(
              "DATA VALIDATION SUCCESSFUL"
          )

          PY


      - name: Commit updated data

        shell: bash

        run: |

          git config \
            user.name \
            "WorldElite Bot"

          git config \
            user.email \
            "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "Auto update WorldElite data"

            git push

          fi



  # ===========================================================
  # BUILD
  # ===========================================================

  build:

    runs-on: ubuntu-latest

    needs:
      - update-data

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure Pages

        uses: actions/configure-pages@v5


      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: .



  # ===========================================================
  # DEPLOY
  # ===========================================================

  deploy:

    environment:

      name: github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
