              ]
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("WorldElite data.json updated successfully.")
          PY

      - name: Check changes
        run: |
          git status
          cat data.json | head -30

      - name: Commit changes
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
          git commit -m "Update WorldElite data"

      - name: Push changes
        run: |
          git push
