name: Update WorldElite Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          data["lastUpdated"] = datetime.now(timezone.utc).isoformat()

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("WorldElite data timestamp updated")
          PY

      - name: Save changes
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update WorldElite data"
          git push
