name: WorldElite Automatic Data Update

on:

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: worldelite
  cancel-in-progress: false


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # =====================================================
      # CHECK EXISTING DATA
      # =====================================================

      - name: Check existing billionaire dataset
        shell: bash
        run: |

          python - <<'PY'

          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          if isinstance(data, list):

              billionaires = data

          elif isinstance(data, dict):

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

          else:

              billionaires = []


          print(
              "Billionaires before update:",
              len(billionaires)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: billionaire dataset is unexpectedly small."
              )

          PY


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pandas \
            lxml


      # =====================================================
      # BUILD COMPANY DATABASE
      #
      # No FMP.
      # No API key.
      # No 402.
      #
      # Existing companies are NEVER deleted.
      # =====================================================

      - name: Build global company database
        shell: bash
        run: |

          python - <<'PY'

          import json
          import re
          import requests
          import pandas as pd
          from datetime import datetime, timezone


          DATA_FILE = "data.json"


          # -------------------------------------------------
          # Load existing data
          # -------------------------------------------------

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if isinstance(data, list):

              billionaires = data
              existing_companies = []
              metadata = {}

          else:

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

              existing_companies = (
                  data.get("companies")
                  or data.get("Companies")
                  or []
              )

              metadata = (
                  data.get("metadata")
                  or {}
              )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "Refusing update because billionaire dataset is too small."
              )


          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Existing companies:",
              len(existing_companies)
          )


          # -------------------------------------------------
          # Preserve every existing company.
          # -------------------------------------------------

          company_map = {}


          for company in existing_companies:

              if not isinstance(
                  company,
                  dict
              ):
                  continue


              name = (
                  company.get("name")
                  or company.get("companyName")
                  or company.get("company_name")
              )


              if not name:
                  continue


              key = re.sub(
                  r"\s+",
                  " ",
                  str(name)
                      .strip()
                      .lower()
              )


              company_map[key] = company


          # -------------------------------------------------
          # Public company universe
          #
          # Wikipedia's company lists are used only to
          # create/enrich the company universe.
          #
          # Existing records are preserved.
          # -------------------------------------------------

          urls = [

              "https://en.wikipedia.org/wiki/"
              "List_of_largest_companies_by_revenue",

              "https://en.wikipedia.org/wiki/"
              "List_of_largest_companies_in_the_United_States_by_revenue",

              "https://en.wikipedia.org/wiki/"
              "List_of_largest_technology_companies_by_revenue"

          ]


          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "WorldElite/1.0 "
                  "(educational data project)"
          })


          discovered = {}


          for url in urls:

              try:

                  print(
                      "Reading:",
                      url
                  )


                  tables = pd.read_html(
                      url
                  )


                  for table in tables:

                      if table.empty:
                          continue


                      columns = [
                          str(c).lower()
                          for c in table.columns
                      ]


                      # Find company/name column

                      name_column = None


                      for original, lower in zip(
                          table.columns,
                          columns
                      ):

                          if (
                              "company" in lower
                              or lower == "name"
                          ):

                              name_column = original
                              break


                      if name_column is None:
                          continue


                      for _, row in table.iterrows():

                          raw_name =
                              row.get(
                                  name_column
                              )


                          if pd.isna(raw_name):
                              continue


                          name = str(
                              raw_name
                          ).strip()


                          if (
                              not name
                              or
                              len(name) < 2
                          ):
                              continue


                          # Ignore table headers

                          if name.lower() in {
                              "company",
                              "name",
                              "company name"
                          }:
                              continue


                          key = re.sub(
                              r"\s+",
                              " ",
                              name.lower()
                          )


                          item = {
                              "name": name,
                              "dataSource":
                                  "Wikimedia / Wikipedia",
                              "sourceUrl":
                                  url
                          }


                          # Revenue column

                          for original, lower in zip(
                              table.columns,
                              columns
                          ):

                              if (
                                  "revenue"
                                  in lower
                              ):

                                  value = row.get(
                                      original
                                  )

                                  if (
                                      pd.notna(value)
                                  ):

                                      text = str(
                                          value
                                      )


                                      numbers = re.findall(
                                          r"[-+]?[0-9]*\.?[0-9]+",
                                          text
                                      )


                                      if numbers:

                                          try:

                                              number = float(
                                                  numbers[0]
                                              )


                                              # Wikipedia tables
                                              # frequently report
                                              # revenue in millions.

                                              if (
                                                  "million"
                                                  in lower
                                                  or
                                                  "usd million"
                                                  in lower
                                              ):

                                                  number *= 1_000_000


                                              item[
                                                  "revenue"
                                              ] = number

                                          except:
                                              pass

                                  break


                          # Profit column

                          for original, lower in zip(
                              table.columns,
                              columns
                          ):

                              if (
                                  "profit"
                                  in lower
                                  or
                                  "net income"
                                  in lower
                              ):

                                  value = row.get(
                                      original
                                  )

                                  if pd.notna(value):

                                      numbers = re.findall(
                                          r"[-+]?[0-9]*\.?[0-9]+",
                                          str(value)
                                      )

                                      if numbers:

                                          try:

                                              number = float(
                                                  numbers[0]
                                              )

                                              if (
                                                  "million"
                                                  in lower
                                              ):

                                                  number *= 1_000_000

                                              item[
                                                  "netProfit"
                                              ] = number

                                          except:
                                              pass

                                  break


                          discovered[
                              key
                          ] = item


              except Exception as error:

                  print(
                      "Source failed:",
                      error
                  )


          print(
              "Discovered company records:",
              len(discovered)
          )


          # -------------------------------------------------
          # Merge discovered companies with existing data.
          # Existing data always wins where it has richer
          # information.
          # -------------------------------------------------

          for key, incoming in discovered.items():

              if key in company_map:

                  company =
                      company_map[key]


                  # Add missing values only

                  for field, value in incoming.items():

                      if (
                          field not in company
                          or
                          company[field] in (
                              None,
                              "",
                              0,
                              []
                          )
                      ):

                          company[field] = value

              else:

                  company_map[key] = incoming


          companies = list(
              company_map.values()
          )


          # -------------------------------------------------
          # Add useful metadata.
          # -------------------------------------------------

          metadata[
              "lastAutomaticUpdate"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "companySource"
          ] = (
              "Wikimedia / Wikipedia public company lists"
          )


          metadata[
              "companyRecords"
          ] = len(companies)


          # -------------------------------------------------
          # SAFETY:
          # Never destroy companies.
          # -------------------------------------------------

          if (
              len(existing_companies) > 0
              and
              len(companies) <
              len(existing_companies)
          ):

              print(
                  "Safety check: keeping existing company dataset."
              )

              companies = existing_companies


          # -------------------------------------------------
          # Write data
          # -------------------------------------------------

          output = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata
          }


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "FINAL BILLIONAIRES:",
              len(billionaires)
          )

          print(
              "FINAL COMPANIES:",
              len(companies)
          )


          if len(companies) < 1000:

              print(
                  "WARNING: fewer than 1000 companies were discovered."
              )

              print(
                  "Existing company records were preserved."
              )

          PY


      # =====================================================
      # VALIDATE
      # =====================================================

      - name: Validate final data
        shell: bash
        run: |

          python - <<'PY'

          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          billionaires =
              data.get(
                  "billionaires",
                  []
              )


          companies =
              data.get(
                  "companies",
                  []
              )


          print(
              "Final billionaire count:",
              len(billionaires)
          )


          print(
              "Final company count:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: billionaire data corrupted."
              )


          if "companies" not in data:

              raise SystemExit(
                  "ERROR: companies field disappeared."
              )


          if not isinstance(
              companies,
              list
          ):

              raise SystemExit(
                  "ERROR: companies is not a list."
              )

          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated data
        shell: bash
        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
              "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

              echo "No data changes."

          else

              git commit \
                  -m "Auto update WorldElite data"

              git push

          fi



  # =======================================================
  # GITHUB PAGES BUILD
  # =======================================================

  build:

    runs-on: ubuntu-latest

    needs:
      - update-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .



  # =======================================================
  # DEPLOY
  # =======================================================

  deploy:

    runs-on: ubuntu-latest

    needs:
      - build

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
