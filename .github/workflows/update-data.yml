name: WorldElite Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldelite-pages
  cancel-in-progress: false


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =====================================================
      # UPDATE COMPANY DATA FROM SEC EDGAR
      # =====================================================

      - name: Update companies from SEC EDGAR

        shell: bash

        env:
          SEC_USER_AGENT: "WorldElite/1.0 worldelite@example.com"

        run: |

          python - <<'PY'

          import json
          import os
          import time
          import requests
          from datetime import datetime, timezone


          DATA_FILE = "data.json"

          SEC_USER_AGENT = os.environ.get(
              "SEC_USER_AGENT",
              "WorldElite/1.0 worldelite@example.com"
          )


          headers = {
              "User-Agent": SEC_USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Host": "www.sec.gov"
          }


          # =================================================
          # LOAD CURRENT DATA
          # =================================================

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if isinstance(data, list):

              billionaires = data
              companies = []
              metadata = {}

          elif isinstance(data, dict):

              billionaires = (
                  data.get("billionaires")
                  or data.get("Billionaires")
                  or data.get("people")
                  or []
              )

              companies = (
                  data.get("companies")
                  or data.get("Companies")
                  or []
              )

              metadata = (
                  data.get("metadata")
                  or {}
              )

          else:

              raise SystemExit(
                  "ERROR: Invalid data.json structure."
              )


          print(
              "Billionaires before update:",
              len(billionaires)
          )

          print(
              "Existing companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: Billionaire dataset is too small."
              )


          # =================================================
          # SEC COMPANY TICKER LIST
          # =================================================

          print(
              "Downloading SEC company universe..."
          )


          ticker_url = (
              "https://www.sec.gov/files/"
              "company_tickers.json"
          )


          response = requests.get(
              ticker_url,
              headers=headers,
              timeout=60
          )


          if response.status_code != 200:

              raise SystemExit(
                  "SEC ticker request failed: "
                  + str(response.status_code)
              )


          ticker_data = response.json()


          sec_companies = []


          for item in ticker_data.values():

              if not isinstance(item, dict):
                  continue


              cik = item.get("cik_str")
              ticker = item.get("ticker")
              name = item.get("title")


              if not cik:
                  continue

              if not ticker:
                  continue

              if not name:
                  continue


              sec_companies.append({

                  "cik": str(cik).zfill(10),

                  "ticker":
                      str(ticker).upper(),

                  "name":
                      str(name).strip()

              })


          print(
              "SEC companies found:",
              len(sec_companies)
          )


          if len(sec_companies) < 1000:

              raise SystemExit(
                  "SEC returned fewer than 1000 companies."
              )


          # =================================================
          # EXISTING COMPANY MAP
          # =================================================

          existing_by_ticker = {}


          for company in companies:

              if not isinstance(company, dict):
                  continue


              ticker = (
                  company.get("ticker")
                  or company.get("symbol")
                  or company.get("tickerSymbol")
              )


              if ticker:

                  existing_by_ticker[
                      str(ticker).upper().strip()
                  ] = company


          # =================================================
          # BUILD COMPANY LIST
          #
          # Keep existing companies and add SEC companies.
          # =================================================

          updated_companies = []


          # We use a large universe but avoid making
          # thousands of SEC API requests every day.
          #
          # First 1200 SEC issuers are enough to create
          # a 1000+ company database.
          #
          # Existing companies are always preserved.
          # =================================================

          selected = sec_companies[:1200]


          for company_info in selected:

              ticker = company_info["ticker"]

              name = company_info["name"]

              cik = company_info["cik"]


              old = existing_by_ticker.get(
                  ticker,
                  {}
              )


              company = dict(old)


              company["name"] = (
                  old.get("name")
                  or name
              )


              company["ticker"] = ticker

              company["symbol"] = ticker

              company["cik"] = cik


              company["country"] = (
                  old.get("country")
                  or "United States"
              )


              company["financialSource"] = (
                  "U.S. Securities and Exchange Commission EDGAR"
              )


              updated_companies.append(
                  company
              )


          # =================================================
          # PRESERVE OLD COMPANIES THAT ARE NOT IN
          # THE CURRENT SEC SELECTION
          # =================================================

          selected_tickers = {
              c["ticker"]
              for c in updated_companies
              if c.get("ticker")
          }


          for old_company in companies:

              if not isinstance(
                  old_company,
                  dict
              ):
                  continue


              ticker = (
                  old_company.get("ticker")
                  or old_company.get("symbol")
              )


              if not ticker:
                  continue


              ticker = str(
                  ticker
              ).upper().strip()


              if ticker not in selected_tickers:

                  updated_companies.append(
                      old_company
                  )


          companies = updated_companies


          print(
              "Company universe:",
              len(companies)
          )


          # =================================================
          # SEC COMPANY FACTS
          # =================================================

          successful = 0

          failed = 0


          # Update financial information for the first
          # 1000 companies.
          #
          # SEC requests must be controlled carefully.
          # SEC recommends staying within its rate limits.
          # =================================================

          for index, company in enumerate(
              companies[:1000]
          ):

              cik = company.get("cik")


              if not cik:
                  continue


              url = (
                  "https://data.sec.gov/api/xbrl/"
                  "companyfacts/CIK"
                  + str(cik).zfill(10)
                  + ".json"
              )


              try:

                  time.sleep(0.15)


                  r = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              SEC_USER_AGENT,
                          "Accept-Encoding":
                              "gzip, deflate"
                      },
                      timeout=30
                  )


                  if r.status_code != 200:

                      print(
                          company.get("ticker"),
                          "SEC:",
                          r.status_code
                      )

                      failed += 1

                      continue


                  facts = r.json()


                  us_gaap = (
                      facts.get("facts", {})
                      .get("us-gaap", {})
                  )


                  # -----------------------------------------
                  # REVENUE
                  # -----------------------------------------

                  revenue_tags = [

                      "RevenueFromContractWithCustomerExcludingAssessedTax",

                      "Revenues",

                      "SalesRevenueNet",

                      "SalesRevenueGoodsNet",

                      "RevenueFromContractWithCustomerIncludingAssessedTax"

                  ]


                  # -----------------------------------------
                  # NET PROFIT
                  # -----------------------------------------

                  profit_tags = [

                      "NetIncomeLoss",

                      "ProfitLoss",

                      "NetIncomeLossAvailableToCommonStockholdersBasic"

                  ]


                  # -----------------------------------------
                  # GROSS PROFIT
                  # -----------------------------------------

                  gross_tags = [

                      "GrossProfit"

                  ]


                  def latest_annual_value(
                      tags
                  ):

                      for tag in tags:

                          concept = us_gaap.get(
                              tag
                          )


                          if not concept:
                              continue


                          units = concept.get(
                              "units",
                              {}
                          )


                          for unit_values in units.values():

                              annual = []


                              for item in unit_values:

                                  form = item.get(
                                      "form"
                                  )


                                  fp = item.get(
                                      "fp"
                                  )


                                  val = item.get(
                                      "val"
                                  )


                                  end = item.get(
                                      "end"
                                  )


                                  if (
                                      form in
                                      ["10-K", "20-F", "40-F"]
                                      and
                                      val is not None
                                      and
                                      end
                                  ):

                                      annual.append(
                                          item
                                      )


                              if annual:

                                  annual.sort(
                                      key=lambda x:
                                      x.get(
                                          "end",
                                          ""
                                      ),
                                      reverse=True
                                  )


                                  return annual[0].get(
                                      "val"
                                  )


                      return None


                  revenue = latest_annual_value(
                      revenue_tags
                  )


                  profit = latest_annual_value(
                      profit_tags
                  )


                  gross_profit = latest_annual_value(
                      gross_tags
                  )


                  if revenue is not None:

                      company[
                          "revenue"
                      ] = revenue


                  if profit is not None:

                      company[
                          "netProfit"
                      ] = profit


                  if gross_profit is not None:

                      company[
                          "grossProfit"
                      ] = gross_profit


                  company[
                      "financialUpdated"
                  ] = datetime.now(
                      timezone.utc
                  ).isoformat()


                  company[
                      "financialSource"
                  ] = (
                      "SEC EDGAR XBRL"
                  )


                  successful += 1


                  print(
                      f"[{index + 1}/1000]",
                      company.get(
                          "ticker"
                      ),
                      "updated"
                  )


              except Exception as error:

                  failed += 1

                  print(
                      "Failed:",
                      company.get(
                          "ticker"
                      ),
                      error
                  )


          # =================================================
          # FINAL METADATA
          # =================================================

          metadata[
              "lastAutomaticUpdate"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "companyFinancialUpdates"
          ] = successful


          metadata[
              "companyFinancialFailures"
          ] = failed


          metadata[
              "companySource"
          ] = (
              "U.S. Securities and Exchange Commission EDGAR"
          )


          metadata[
              "companyUniverse"
          ] = (
              "SEC company_tickers.json"
          )


          # =================================================
          # SAVE
          # =================================================

          output = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata

          }


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "======================================"
          )

          print(
              "WorldElite update completed"
          )

          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Companies:",
              len(companies)
          )

          print(
              "Financial updates:",
              successful
          )

          print(
              "Financial failures:",
              failed
          )

          print(
              "======================================"
          )

          PY


      # =====================================================
      # VALIDATE DATA
      # =====================================================

      - name: Validate final data

        shell: bash

        run: |

          python - <<'PY'

          import json


          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if not isinstance(
              data,
              dict
          ):

              raise SystemExit(
                  "ERROR: data.json must be an object."
              )


          billionaires = data.get(
              "billionaires",
              []
          )


          companies = data.get(
              "companies",
              []
          )


          print(
              "Billionaires:",
              len(billionaires)
          )


          print(
              "Companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: Billionaire dataset corrupted."
              )


          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: Company dataset contains fewer than 1000 companies."
              )


          if "metadata" not in data:

              raise SystemExit(
                  "ERROR: metadata missing."
              )


          print(
              "DATA VALIDATION PASSED"
          )

          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated data

        shell: bash

        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
            "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

              echo "No data changes."

          else

              git commit \
                -m "Auto update WorldElite data"

              git push

          fi



  # =========================================================
  # BUILD
  # =========================================================

  build:

    runs-on: ubuntu-latest

    needs:
      - update-data


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure Pages

        uses: actions/configure-pages@v5


      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:
          path: .



  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:

    runs-on: ubuntu-latest

    needs:
      - build


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
