name: Update WorldElite Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Update data
        run: |
          echo "Updating WorldElite data..."
          date -u

      - name: Commit changes
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update WorldElite data"
          git push
