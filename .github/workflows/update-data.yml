name: WorldElite Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "data.json"
      - "index.html"
      - "script.js"
      - "style.css"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check data.json
        run: |
          if [ ! -f data.json ]; then
            echo "data.json not found"
            exit 1
          fi
          python - <<'PY'
          import json
          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if isinstance(data, list):
              print("Records:", len(data))
          elif isinstance(data, dict):
              people = (data.get("billionaires") or data.get("people") or data.get("persons") or data.get("data") or [])
              companies = (data.get("companies") or data.get("businesses") or [])
              print("Billionaires:", len(people))
              print("Companies:", len(companies))
          else:
              raise ValueError("Unsupported data.json format")
          print("Data OK")
          PY

      - name: Configure Git
        run: |
          git config user.name "WorldElite Bot"
          git config user.email "worldelite-bot@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add data.json index.html script.js style.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update WorldElite data"
          git fetch origin main
          git pull --rebase origin main || git pull origin main --no-rebase
          git push origin main
