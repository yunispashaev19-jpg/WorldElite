name: WorldElite Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: worldelite-production
  cancel-in-progress: false


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # 2. PYTHON
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # =====================================================
      # 3. UPDATE DATA
      # =====================================================

      - name: Build WorldElite data

        env:

          SEC_USER_AGENT: >
            WorldElite/1.0
            contact: worldelite@example.com

        shell: bash

        run: |

          python - <<'PY'

          import json
          import os
          import requests
          from datetime import datetime, timezone


          DATA_FILE = "data.json"


          USER_AGENT = os.environ.get(
              "SEC_USER_AGENT",
              "WorldElite/1.0 contact: worldelite@example.com"
          )


          SEC_HEADERS = {

              "User-Agent": USER_AGENT,

              "Accept-Encoding":
                  "gzip, deflate"

          }


          # =================================================
          # LOAD EXISTING DATA
          # =================================================

          print()
          print("==========================================")
          print("WORLD ELITE DATA UPDATE")
          print("==========================================")
          print()


          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              old_data = json.load(f)


          if isinstance(old_data, list):

              billionaires = old_data

              old_companies = []

              metadata = {}


          elif isinstance(old_data, dict):

              billionaires = (

                  old_data.get("billionaires")

                  or old_data.get("Billionaires")

                  or old_data.get("people")

                  or []

              )


              old_companies = (

                  old_data.get("companies")

                  or old_data.get("Companies")

                  or []

              )


              metadata = (

                  old_data.get("metadata")

                  or {}

              )


          else:

              raise SystemExit(
                  "ERROR: Invalid data.json"
              )


          print(
              "Billionaires:",
              len(billionaires)
          )


          print(
              "Existing companies:",
              len(old_companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: Billionaire data is corrupted."
              )


          # =================================================
          # DOWNLOAD SEC COMPANY UNIVERSE
          # =================================================

          print()
          print(
              "Downloading SEC company universe..."
          )


          ticker_url = (
              "https://www.sec.gov/files/"
              "company_tickers.json"
          )


          try:

              response = requests.get(

                  ticker_url,

                  headers=SEC_HEADERS,

                  timeout=60

              )

          except Exception as error:

              raise SystemExit(
                  "SEC request failed: "
                  + str(error)
              )


          print(
              "SEC status:",
              response.status_code
          )


          if response.status_code != 200:

              raise SystemExit(
                  "SEC company list request failed."
              )


          sec_data = response.json()


          if not isinstance(
              sec_data,
              dict
          ):

              raise SystemExit(
                  "SEC returned invalid company data."
              )


          # =================================================
          # CREATE COMPANY LIST
          # =================================================

          companies = []


          for item in sec_data.values():

              if not isinstance(
                  item,
                  dict
              ):

                  continue


              cik = item.get(
                  "cik_str"
              )


              ticker = item.get(
                  "ticker"
              )


              name = item.get(
                  "title"
              )


              if not cik:
                  continue


              if not ticker:
                  continue


              if not name:
                  continue


              companies.append({

                  "name":
                      str(name).strip(),

                  "ticker":
                      str(ticker)
                      .strip()
                      .upper(),

                  "symbol":
                      str(ticker)
                      .strip()
                      .upper(),

                  "cik":
                      str(cik)
                      .zfill(10),

                  "country":
                      "United States",

                  "biography":
                      (
                          "Public company filing "
                          "information available "
                          "through SEC EDGAR."
                      ),

                  "investments":
                      [],

                  "stakes":
                      [],

                  "revenue":
                      0,

                  "netProfit":
                      0,

                  "grossProfit":
                      0,

                  "financialSource":
                      "SEC EDGAR"

              })


          print(
              "SEC companies downloaded:",
              len(companies)
          )


          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: SEC returned fewer than 1000 companies."
              )


          # =================================================
          # KEEP EXISTING COMPANY INFORMATION
          # =================================================

          old_by_ticker = {}


          for company in old_companies:

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              ticker = (

                  company.get("ticker")

                  or company.get("symbol")

                  or company.get("tickerSymbol")

              )


              if ticker:

                  old_by_ticker[
                      str(ticker)
                      .strip()
                      .upper()
                  ] = company


          # =================================================
          # MERGE OLD + NEW
          # =================================================

          merged_companies = []


          for company in companies:

              ticker = company["ticker"]


              old = old_by_ticker.get(
                  ticker
              )


              if old:

                  merged = dict(
                      company
                  )


                  # Preserve useful existing fields.

                  for key, value in old.items():

                      if value not in (
                          None,
                          "",
                          [],
                          {}
                      ):

                          merged[key] = value


                  # Never lose SEC identity.

                  merged["ticker"] = ticker

                  merged["symbol"] = ticker

                  merged["cik"] = company["cik"]

                  merged_companies.append(
                      merged
                  )

              else:

                  merged_companies.append(
                      company
                  )


          companies = merged_companies


          # =================================================
          # IMPORTANT
          #
          # Limit is 1500 companies.
          # This gives us a guaranteed 1000+ dataset
          # without making thousands of requests.
          # =================================================

          companies = companies[:1500]


          print(
              "Final company universe:",
              len(companies)
          )


          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: Final company list is below 1000."
              )


          # =================================================
          # FINANCIAL DATA
          #
          # Update SEC financial information for the first
          # 300 companies.
          #
          # The other companies remain in the database.
          # =================================================

          print()
          print(
              "Updating financial information..."
          )


          financial_updates = 0

          financial_failures = 0


          def find_fact(
              facts,
              tags
          ):

              us_gaap = (

                  facts
                  .get("facts", {})
                  .get("us-gaap", {})

              )


              for tag in tags:

                  concept = us_gaap.get(
                      tag
                  )


                  if not concept:
                      continue


                  units = concept.get(
                      "units",
                      {}
                  )


                  candidates = []


                  for unit_name, values in units.items():

                      if not isinstance(
                          values,
                          list
                      ):

                          continue


                      for value in values:

                          if not isinstance(
                              value,
                              dict
                          ):

                              continue


                          if value.get(
                              "form"
                          ) not in (
                              "10-K",
                              "20-F",
                              "40-F"
                          ):

                              continue


                          if value.get(
                              "val"
                          ) is None:

                              continue


                          if not value.get(
                              "end"
                          ):

                              continue


                          candidates.append(
                              value
                          )


                  if candidates:

                      candidates.sort(

                          key=lambda x:
                              x.get(
                                  "end",
                                  ""
                              ),

                          reverse=True

                      )


                      return candidates[0].get(
                          "val"
                      )


              return None


          # =================================================
          # SEC REQUESTS
          # =================================================

          for number, company in enumerate(
              companies[:300],
              start=1
          ):

              cik = company.get(
                  "cik"
              )


              if not cik:
                  continue


              url = (

                  "https://data.sec.gov/api/xbrl/"
                  "companyfacts/CIK"
                  + str(cik).zfill(10)
                  + ".json"

              )


              try:

                  request = requests.get(

                      url,

                      headers=SEC_HEADERS,

                      timeout=30

                  )


                  if request.status_code != 200:

                      financial_failures += 1

                      print(

                          f"[{number}/300] "
                          f"{company.get('ticker')} "
                          f"HTTP {request.status_code}"

                      )

                      continue


                  facts = request.json()


                  revenue = find_fact(

                      facts,

                      [

                          "RevenueFromContractWithCustomerExcludingAssessedTax",

                          "Revenues",

                          "SalesRevenueNet"

                      ]

                  )


                  net_profit = find_fact(

                      facts,

                      [

                          "NetIncomeLoss",

                          "ProfitLoss"

                      ]

                  )


                  gross_profit = find_fact(

                      facts,

                      [

                          "GrossProfit"

                      ]

                  )


                  if revenue is not None:

                      company[
                          "revenue"
                      ] = revenue


                  if net_profit is not None:

                      company[
                          "netProfit"
                      ] = net_profit


                  if gross_profit is not None:

                      company[
                          "grossProfit"
                      ] = gross_profit


                  company[
                      "financialSource"
                  ] = "SEC EDGAR XBRL"


                  company[
                      "financialUpdated"
                  ] = datetime.now(
                      timezone.utc
                  ).isoformat()


                  financial_updates += 1


                  print(

                      f"[{number}/300] "
                      f"{company.get('ticker')} "
                      f"updated"

                  )


              except Exception as error:

                  financial_failures += 1

                  print(

                      f"[{number}/300] "
                      f"{company.get('ticker')} "
                      f"failed: {error}"

                  )


          # =================================================
          # METADATA
          # =================================================

          metadata[
              "lastAutomaticUpdate"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          metadata[
              "companyCount"
          ] = len(companies)


          metadata[
              "companyFinancialUpdates"
          ] = financial_updates


          metadata[
              "companyFinancialFailures"
          ] = financial_failures


          metadata[
              "companySource"
          ] = "SEC EDGAR"


          metadata[
              "companyUniverseSource"
          ] = (
              "SEC company_tickers.json"
          )


          # =================================================
          # FINAL DATA
          # =================================================

          final_data = {

              "billionaires":
                  billionaires,

              "companies":
                  companies,

              "metadata":
                  metadata

          }


          # =================================================
          # WRITE DATA.JSON
          # =================================================

          with open(

              DATA_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  final_data,

                  f,

                  ensure_ascii=False,

                  indent=2

              )


          # =================================================
          # FINAL CHECK
          # =================================================

          print()
          print(
              "=========================================="
          )

          print(
              "FINAL DATA"
          )

          print(
              "Billionaires:",
              len(billionaires)
          )

          print(
              "Companies:",
              len(companies)
          )

          print(
              "Financial updates:",
              financial_updates
          )

          print(
              "Financial failures:",
              financial_failures
          )

          print(
              "=========================================="
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "ERROR: Billionaires disappeared."
              )


          if len(companies) < 1000:

              raise SystemExit(
                  "ERROR: Companies were not created."
              )


          print(
              "DATA UPDATE SUCCESSFUL"
          )

          PY


      # =====================================================
      # 4. VALIDATE JSON
      # =====================================================

      - name: Validate data.json

        shell: bash

        run: |

          python - <<'PY'

          import json


          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          billionaires = data.get(
              "billionaires",
              []
          )


          companies = data.get(
              "companies",
              []
          )


          print(
              "Validated billionaires:",
              len(billionaires)
          )


          print(
              "Validated companies:",
              len(companies)
          )


          if len(billionaires) < 3000:

              raise SystemExit(
                  "Billionaire validation failed."
              )


          if len(companies) < 1000:

              raise SystemExit(
                  "Company validation failed."
              )


          print(
              "JSON VALIDATION PASSED"
          )

          PY


      # =====================================================
      # 5. CONFIGURE GITHUB PAGES
      # =====================================================

      - name: Configure Pages

        uses: actions/configure-pages@v5


      # =====================================================
      # 6. UPLOAD THE ACTUAL CURRENT WORKSPACE
      #
      # IMPORTANT:
      #
      # This is the SAME workspace in which data.json
      # was just generated.
      #
      # There is no second checkout.
      # =====================================================

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: .


      # =====================================================
      # 7. SAVE DATA.JSON TO REPOSITORY
      # =====================================================

      - name: Commit updated data

        shell: bash

        run: |

          git config user.name "WorldElite Bot"

          git config user.email \
            "worldelite-bot@users.noreply.github.com"


          git add data.json


          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "Auto update WorldElite data"

            git push

          fi


  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:

    runs-on: ubuntu-latest

    needs:
      - build-and-deploy


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
